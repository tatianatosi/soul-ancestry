identity:
  # Nenhum SDK de analytics: nao existem chamadas identify() nem group().
  # A identidade e relacional, carregada em coluna em cada evento.
  identify_calls: []
  group_calls: []
  observed_mechanism:
    - field: organization_id
      present_in: [audit_logs, client_access_events, case_timeline_events, institutional_profile_events, owner_override_events, client_tab_dwell_events]
      note: "Coluna NOT NULL nos coletores; equivale ao grupo/tenant"
    - field: user_id
      present_in: [audit_logs]
      note: "Ator da acao, quando informado pelo writer"
    - field: actor_user_id
      present_in: [client_access_events, owner_override_events]
    - field: auth_user_id
      present_in: [client_access_events]
      note: "Usuario de auth do cliente no App"
    - field: case_id
      present_in: [case_timeline_events, client_tab_dwell_events]
      note: "Unidade de trabalho; segundo nivel de agrupamento de fato"
  server_context:
    - "context.userId vem do middleware requireSupabaseAuth em 668 de 678 createServerFn"
    - "auth.uid() usado dentro de funcoes SECURITY DEFINER (portal_meu_acesso, portal_meu_cliente)"

patterns:
  naming_style: snake_case
  naming_exceptions:
    - "7 valores em ingles no vocabulario de audit_logs (ex.: download, export_csv, awaiting_documents, analysis_blocked_insufficient_case_data), o resto em portugues"
    - "client_access_events usa vocabulario integralmente em ingles (access_denied, authenticated, magic_link_sent)"
  centralized: parcial
  centralization_detail:
    - "4 helpers compartilhados existem: registrarEvento (client_access_events), registrarTimelineCaso (case_timeline_events), registrar (audit_logs, escopo onboarding), registrarEventoInstitucional (institutional_profile_events)"
    - "audit_logs tambem recebe 98 inserts diretos espalhados por 55 arquivos, sem passar por helper"
    - "institutional_profile_events tem caminho duplicado: 2 inserts diretos em perfil-institucional-persistido.functions.ts e 1 helper em perfil-institucional-persistido.server.ts"
  delivery: sincrono
  delivery_detail:
    - "Insert direto no Postgres dentro do mesmo handler da acao; sem fila, sem batch, sem flush"
    - "registrarEventoInstitucional devolve { registrado, motivo } em vez de lancar"
    - "A maioria dos inserts de audit_logs nao verifica o erro de retorno"
  orphans:
    - name: registrarEventoInstitucional
      kind: helper
      location: src/lib/perfil-institucional-persistido.server.ts:32
      note: "Definido e exportado; nenhum chamador fora do proprio arquivo. A tabela e alimentada por inserts diretos"
    - name: "eventType pendencia"
      kind: valor_de_vocabulario
      location: src/lib/timeline-operacional.server.ts:18
      note: "Declarado na uniao de tipos (caso | tarefa | pendencia); nenhum call site usa pendencia"
  hygiene_observations:
    - "audit_logs acumula 68 valores distintos de acao, de granularidades diferentes: desde criar_lead ate qualificacao_contratada_reconciliada_com_perfil_institucional"
    - "4 valores de acao chegam pelo helper registrar() e 64 por insert direto; os dois caminhos coexistem na mesma tabela"
    - "client_tab_dwell_events e o unico coletor de comportamento (tempo por aba); os outros cinco registram mudanca de estado"
    - "Nenhum evento carrega propriedade de sessao, dispositivo, referrer ou origem de trafego"
    - "institutional_profile_events: valores adicionais de evento sao declarados em perfil-institucional-persistido.ts e passados por variavel, nao por literal no insert"
