name: Painel de sincronização

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"   # 08:00 em São Paulo
  workflow_dispatch:
    inputs:
      marcar_publicado:
        description: "Registrar declaração manual de publicação; não verifica o site"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

# S6 (01/11/2026): também roda a cada push na main. A espera de 90 s e o cancelamento do run
# anterior fazem a rajada de commits do editor virar uma única atualização do painel.
concurrency:
  group: painel-sync-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a rajada de commits terminar
        if: github.event_name == 'push'
        run: sleep 90
      - uses: actions/github-script@v7
        # Checkout trusted main scripts for the read-only retrospective audit.
        # No PR code is executed here.
        id: report
        with:
          script: |
            const { owner, repo } = context.repo;
            const TITLE = "Painel de sincronização (Git, Lovable, Claude Code)";
            const LABEL = "painel-sync";
            const DAY = 86400000;
            const now = Date.now();

            const br = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const head = br.data.commit.sha;
            const headDate = br.data.commit.commit.committer.date;

            try { await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: "2F4B6E" }); } catch (e) {}

            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: LABEL, per_page: 100 });
            let issue = open.find(i => i.title === TITLE);
            let published = null;
            if (issue) {
              const m = (issue.body || "").match(/<!-- published_sha: ([0-9a-f]{40}) -->/);
              if (m && !/^0{40}$/.test(m[1])) published = m[1];
            }
            const marcar = context.payload.inputs && context.payload.inputs.marcar_publicado === "true";
            if (marcar) published = head;

            let unpublished = null, recent = [];
            if (published && published !== head) {
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${published}...${head}` });
                unpublished = cmp.data.ahead_by;
                recent = cmp.data.commits.slice(-5).map(c => `- \`${c.sha.slice(0,7)}\` ${c.commit.message.split("\n")[0]}`);
              } catch (e) { unpublished = "?"; }
            } else if (published === head) { unpublished = 0; }

            const prsList = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            const prs = [];
            for (const p of prsList) {
              const d = await github.rest.pulls.get({ owner, repo, pull_number: p.number });
              prs.push(d.data);
            }
            prs.sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at));
            const conflicting = prs.filter(p => p.mergeable_state === "dirty" && !p.draft);

            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            const syncs = branches.filter(b => b.name.startsWith("lovable-sync-"));
            const stale = syncs.filter(b => {
              const t = Number(b.name.split("-").pop()) * 1000;
              return t && now - t > DAY;
            });
            const bySha = {};
            syncs.forEach(b => { (bySha[b.commit.sha] = bySha[b.commit.sha] || []).push(b.name); });
            const redundant = Object.values(bySha).filter(v => v.length > 1).reduce((s, v) => s + v.length - 1, 0);

            let pend = [];
            try {
              const dir = await github.rest.repos.getContent({ owner, repo, path: "supabase/pendentes", ref: "main" });
              for (const f of dir.data.filter(f => f.name.endsWith(".sql"))) {
                const c = await github.rest.repos.getContent({ owner, repo, path: f.path, ref: "main" });
                const txt = Buffer.from(c.data.content, "base64").toString("utf8").split("\n").slice(0, 5).join(" ");
                const m = txt.match(/ESTADO:[^\n]*/);
                pend.push(`- \`${f.name}\`: ${m ? m[0].slice(0, 110) : "sem cabeçalho ESTADO (ver README da pasta)"}`);
              }
            } catch (e) {}

            const alerts = [];
            if (typeof unpublished === "number" && unpublished > 0) alerts.push(`${unpublished} commit(s) depois da declaração manual de publicação; site não verificado`);
            if (!published) alerts.push("nenhum Publish registrado: rode este workflow com marcar_publicado depois do próximo Publish");
            if (conflicting.length) alerts.push(`${conflicting.length} PR(s) prontas, mas em conflito com a main`);
            if (stale.length) alerts.push(`${stale.length} branch(es) lovable-sync com mais de 24 h sem merge`);

            const rows = prs.map(p => {
              const idade = Math.floor((now - new Date(p.updated_at)) / DAY);
              return `| #${p.number} | ${p.draft ? "rascunho" : "pronta"} | ${p.mergeable_state} | ${p.changed_files} | ${idade} d | ${p.title.slice(0, 70).replace(/\|/g, "/")} |`;
            });

            const body = [
              `<!-- published_sha: ${published || "0".repeat(40)} -->`,
              `Atualizado em ${new Date().toISOString()}. Gerado por .github/workflows/sync-report.yml.`,
              ``,
              `## Situação`,
              alerts.length ? alerts.map(a => `- ${a}`).join("\n") : "- Sem alertas nesta heurística; execução integral e publicação não comprovadas.",
              ``,
              `## Main e Lovable`,
              `- HEAD da main: \`${head.slice(0,7)}\` (${headDate}).`,
              `- Último Publish declarado manualmente (não verificado no site): ${published && published !== "0".repeat(40) ? "`" + published.slice(0,7) + "`" : "não registrado"}.`,
              `- Commits na main depois do último Publish: ${unpublished === null ? "desconhecido" : unpublished}.`,
              ...recent,
              ``,
              `## PRs abertas (${prs.length})`,
              `| PR | Tipo | Merge | Arquivos | Parada | Título |`,
              `|---|---|---|---|---|---|`,
              ...rows,
              ``,
              `## Branches lovable-sync`,
              `- Total: ${syncs.length}. Com mais de 24 h: ${stale.length}. Redundantes (mesmo commit de outra): ${redundant}.`,
              ``,
              `## Migrations propostas em supabase/pendentes`,
              ...(pend.length ? pend : ["- Pasta vazia ou não encontrada."]),
              ``,
              `## Rotina do dia`,
              `- [ ] Mergear origin/main na branch de trabalho antes de abrir ou atualizar PR`,
              `- [ ] CI verde (typecheck, test, build)`,
              `- [ ] Merge na main com autorização`,
              `- [ ] Publish no Lovable`,
              `- [ ] Rodar este workflow com marcar_publicado`,
              `- [ ] SQL de pendentes aplicado pelo chat do Lovable e cabeçalho atualizado`
            ].join("\n");

            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              const r = await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: [LABEL] });
              issue = r.data;
            }
            if (alerts.length && !marcar && context.eventName !== "push") {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: "Atenção hoje:\n" + alerts.map(a => `- ${a}`).join("\n") });
            }
            core.setOutput('issue_number', issue.number);
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir evidências de cada PR integrada
        uses: actions/github-script@v7
        with:
          script: |
            const { auditPullRequests } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/audit-pr-completion.mjs`);
            const { owner, repo } = context.repo;
            const results = await auditPullRequests(async path => (await github.request(`GET ${path}`)).data, owner, repo);
            const fs = require('node:fs');
            fs.writeFileSync('pr-completion.json', JSON.stringify(results, null, 2));
            const rows = results.map(r => `| #${r.number} | ${r.sha.slice(0,7)} | integrado | ${r.code_checks} | ${r.evidence} | ${r.pending.join('; ').replace(/\|/g,'/')} | não verificada |`);
            const table = ['## Conferência por PR aplicada', 'Evidências declaradas precisam de revisão humana. Merge e CI não comprovam uso ou publicação.', '| PR | SHA | Código | CI do head | Evidências | Pendências | Publicação |', '|---|---|---|---|---|---|---|', ...rows].join('\n');
            await core.summary.addRaw(table).write();
            const issue_number = Number('${{ steps.report.outputs.issue_number }}');
            const issue = await github.rest.issues.get({owner,repo,issue_number});
            await github.rest.issues.update({owner,repo,issue_number,body: issue.data.body + '\n\n' + table.slice(0, 45000)});
      - uses: actions/upload-artifact@v4
        with:
          name: pr-completion-${{ github.sha }}
          path: pr-completion.json
