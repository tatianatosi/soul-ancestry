name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # S2 (01/11/2026): só PR cancela o run anterior. Na main cada commit mantém o seu CI,
  # senão o editor do Lovable (um commit por minuto) nunca deixa um "último SHA verde".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
